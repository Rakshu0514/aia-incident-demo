name: Send Vercel deployment failures to AIA

on:
  deployment_status:

jobs:
  notify-aia:
    if: github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error'
    runs-on: ubuntu-latest
    steps:
      - name: Forward deployment failure to AIA
        env:
          AIA_WEBHOOK_URL: ${{ secrets.AIA_WEBHOOK_URL }}
          AIA_WEBHOOK_TOKEN: ${{ secrets.AIA_WEBHOOK_TOKEN }}
          GITHUB_EVENT: ${{ toJSON(github.event) }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          event = json.loads(os.environ["GITHUB_EVENT"])
          status = event["deployment_status"]
          deployment = event["deployment"]

          body = {
              "id": str(status.get("id") or deployment.get("id")),
              "type": "deployment.error",
              "payload": {
                  "deployment": {
                      "id": deployment.get("id"),
                      "url": status.get("environment_url") or status.get("target_url"),
                      "environment": deployment.get("environment"),
                  },
                  "project": {},
                  "repository": {"full_name": os.environ["GITHUB_REPOSITORY"]},
                  "errorMessage": status.get("description") or status.get("state"),
                  "git": {
                      "ref": deployment.get("ref"),
                      "sha": deployment.get("sha"),
                  },
              },
          }

          request = urllib.request.Request(
              os.environ["AIA_WEBHOOK_URL"],
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["AIA_WEBHOOK_TOKEN"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print("AIA response:", response.status, response.read().decode("utf-8"))
          PY
